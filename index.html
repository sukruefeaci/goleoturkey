let VC={};
const lsG=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(x){return null}};
const lsS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
function navCiz(){
  document.body.classList.add("in");
  $("pt").textContent="⭐ "+prof.points;
  const T=[["kup","🎫","Kupon"],["top","💬","Topluluk"],["fik","📅","Fikstür"],["pro","👤","Profil"]];
  if(prof.is_admin)T.push(["adm","⚙️","Admin"]);
  $("nav").innerHTML=T.map(([k,i,n])=>`<a id="n-${k}" class="${k==tab?"on":""}" onclick="go('${k}')"><i>${i}</i>${n}</a>`).join("");
  $("nav").style.display="flex";
}
async function start(){
  document.body.classList.toggle("auth",!me);
  if(!me){document.body.classList.remove("in");shKapat();$("nav").style.display="none";$("pt").textContent="";return authV()}
  VC=lsG("gvc_"+me.id)||{};
  const c=lsG("gp_"+me.id),fresh=sb.from("profiles").select("*").eq("id",me.id).single();
  if(c){prof=c;navCiz();go(tab)}
  const {data}=await fresh;
  if(!data){if(!c)toast("Profil yüklenemedi");return}
  const adm=c&&!!c.is_admin;prof=data;lsS("gp_"+me.id,data);
  if(!c){navCiz();go(tab)}else{$("pt").textContent="⭐ "+prof.points;if(adm!=!!data.is_admin)navCiz()}
}
const vKey=t=>t+(t=="kup"?":"+kT+(bSel||""):t=="pro"?":"+pT:t=="top"?":"+ts2:"");
function go(t){
  clearInterval(cdT);tab=t;document.querySelectorAll("nav a").forEach(a=>a.className=a.id=="n-"+t?"on":"");
  const k=vKey(t);$("v").innerHTML=VC[k]||SKEL;window.scrollTo(0,0);
  Promise.resolve(({sp:vSp,kup:vKup,top:vTop,sir:vSir,fik:vFik,pro:vPro,adm:vAdm})[t]()).then(()=>{
    if(tab!=t||vKey(t)!=k||t=="adm"||t=="fik")return;
    VC[k]=$("v").innerHTML;lsS("gvc_"+me.id,VC);
  }).catch(()=>{});
}

/* GIRIS */
function authV(){
  $("v").innerHTML=`<div class="hero"><div class="ring">⚽</div><div class="brand">GOLEO</div><div class="tag">Günlük tahminler. Topluluk onaylı.</div></div>
  <div class="c authc"><h3>${kayit?"Hesap oluştur":"Hoş geldin"}</h3>
  <input id="em" type="email" placeholder="E-posta" autocomplete="email">
  <input id="pw" type="password" placeholder="Şifre (en az 6 karakter)">
  ${kayit?`<input id="un" placeholder="Kullanıcı adı"><input id="rf" placeholder="Referans kodu (varsa)" value="${e(REF)}">`:""}
  <button onclick="auth()"><span>${kayit?"Kayıt Ol":"Giriş Yap"}</span><span>→</span></button>
  <button class="g" onclick="kayit=!kayit;authV()">${kayit?"Zaten hesabım var ›":"Hesabın yok mu? Kayıt ol ›"}</button></div>`}
async function auth(){
  const email=$("em").value.trim(),pw=$("pw").value;let r;
  if(kayit){
    const un=$("un").value.trim();
    if(un.length<3)return toast("Kullanıcı adı en az 3 karakter");
    r=await sb.auth.signUp({email,password:pw,options:{data:{username:un,ref:$("rf").value.trim()}}});
  }else r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return toast(hata(r.error.message));
  if(kayit&&!r.data.session)toast("Kayıt alındı. E-postanı onaylayıp giriş yap.");
}

/* SPONSORLAR */
const spAktif=()=>tab=="pro"&&pT=="sp";
let SPD=new Set(),SPC=new Set(),spBusy={};
const spRw=x=>x.kind=="kanal"&&x.reward>0;
const spPend=()=>{try{return JSON.parse(localStorage.getItem("spPend")||"[]")}catch(x){return[]}};
const spSetPend=a=>{try{localStorage.setItem("spPend",JSON.stringify(a))}catch(x){}};
async function vSp(){
  const [r,st]=await Promise.all([sb.from("sponsors").select("*").eq("active",true).order("sort").order("id"),sb.rpc("sponsor_status")]);
  const data=r.data;SPD=new Set(st.data||[]);
  SPM=Object.fromEntries((data||[]).map(x=>[x.id,x]));
  const l=(data||[]).map(x=>{const rw=spRw(x),ok=SPD.has(x.id);
  return `<div class="c"><div style="display:flex;gap:10px;align-items:center"><div style="font-size:28px">${x.kind=="kanal"?"📢":"🌐"}</div><div style="flex:1;min-width:0"><b>${e(x.title)}</b>${x.descr?`<div class="lg" style="margin:2px 0 0">${e(x.descr)}</div>`:""}</div>${rw?`<span class="pk ${ok?"y":""}" style="margin:0;flex:none">${ok?"✓ ":"+"}${x.reward} puan</span>`:""}</div>
  ${ok||!rw?`<button style="margin-top:10px" ${ok?'class="g"':""} onclick="spGit(${x.id})">${x.kind=="kanal"?(ok?"Kanala git":"Kanala katıl"):"Siteye git"}</button>`
  :`<div class="row" style="margin-top:6px"><button style="flex:3" onclick="spGit(${x.id})">Katıl · +${x.reward} puan</button><button class="g" id="spk${x.id}" style="flex:2" onclick="spAl(${x.id})">Puanımı al</button></div>`}</div>`}).join("");
  if(!spAktif())return;
  $("v").innerHTML=ptabs()+(l||bos("Şu an sponsor yok."));
  const P=spPend();
  (data||[]).filter(x=>spRw(x)&&!SPD.has(x.id)&&(P.includes(x.id)||!SPC.has(x.id))).forEach(x=>spAl(x.id,true));
}
function spGit(id){const x=SPM[id];if(!x)return;
  if(spRw(x)&&!SPD.has(id)){const P=spPend();if(!P.includes(id))spSetPend(P.concat(id));SPC.delete(id)}
  openL(x.url)}
async function spAl(id,quiet){
  if(spBusy[id])return;spBusy[id]=1;SPC.add(id);
  const b=$("spk"+id);if(b&&!quiet){b.disabled=true;b.textContent="Kontrol…"}
  const {data,error}=await sb.rpc("sponsor_claim",{sid:id});
  spBusy[id]=0;
  if(data&&(data.ok||data.done))spSetPend(spPend().filter(x=>x!=id));
  if(data&&data.ok){
    toast(data.msg);
    const {data:p}=await sb.from("profiles").select("points").eq("id",me.id).single();
    if(p){prof.points=p.points;$("pt").textContent="⭐ "+p.points}
    if(spAktif())vSp();return}
  if(!quiet)toast(error?"Kontrol edilemedi":data.msg);
  if(data&&data.done&&spAktif())return vSp();
  const b2=$("spk"+id);if(b2){b2.disabled=false;b2.textContent="Puanımı al"}
}
function spDon(){if(document.visibilityState=="visible"&&me&&spAktif()&&spPend().length)spPend().forEach(id=>{if(SPM[id])spAl(id,true)})}
document.addEventListener("visibilitychange",spDon);
if(tg&&tg.onEvent)tg.onEvent("activated",spDon);

/* KUPON ISTATISTIK (gunluk) */
function kIstH(L){
  let t=0,w=0,l=0;
  (L||[]).forEach(c=>{const I=c.items||[];if(!I.length)return;t++;
    if(I.some(m=>m.durum=="yatti"))l++;else if(I.every(m=>m.durum=="tuttu"))w++});
  if(!t)return"";
  const s=w+l,p=s?Math.round(w*100/s):0,C=2*Math.PI*42,bk=t-s;
  return `<div class="c kst"><div class="kring"><svg viewBox="0 0 100 100"><defs><linearGradient id="kg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B5CFF"/><stop offset="1" stop-color="#E25CFF"/></linearGradient></defs>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="8"/>
  <circle class="karc" cx="50" cy="50" r="42" fill="none" stroke="url(#kg1)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 50 50)"/></svg>
  <div class="kpc"><b>${s?"%"+p:"–"}</b><span>${s?"BAŞARI":"BEKLİYOR"}</span></div></div>
  <div class="kstr"><div class="ksr"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Paylaşılan</span><b>${t}</b></div>
  <div class="ksr"><span class="ok"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.7"/></svg>Kazanan</span><b>${w}</b></div>${bk?`<div class="lg" style="margin:2px 0 0">${bk} kupon sonuç bekliyor</div>`:""}</div></div>`}

function cm(m){

  if(error){$("ci").value=t;return toast("Gönderilemedi, biraz yavaş yaz")}

/* PROFIL */
function cdTick(end){
  const el=$("cd");if(!el){clearInterval(cdT);return}
  const s=Math.floor((new Date(end)-Date.now())/1000);
  if(s<=0){el.textContent="Süre doldu";return}
  const g=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  el.textContent=(g?g+"g ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

/* FIKSTUR */
let fg=new Date(),fF="",fQ="",FM=[],fAt=null,fErr="";
const LP=[/süper lig|super lig/i,/şampiyonlar|champions/i,/avrupa ligi|europa league/i,/konferans|conference/i,/premier/i,/la ?liga|ispanya/i,/serie a|italya/i,/bundesliga|almanya/i,/ligue 1|fransa/i,/1\. ?lig|tff/i,/türkiye|turkiye/i];
const lPri=l=>{const i=LP.findIndex(r=>r.test(l||""));return i<0?99:i};
function fDur(m){
  const d=String(m.dk??"").trim();
  if(/^\d{1,3}'?$/.test(d)){
    const b=parseInt(d),el=fAt?Math.min(5,Math.max(0,Math.floor((Date.now()-new Date(fAt))/6e4))):0;
    const cap=m.st=="1"?45:m.st=="3"?90:b<=45?45:b<=90?90:120,v=b+1+el;
    return{s:"cn",t:v>cap?cap+"+":v+"'"}}
  if(/^\d{1,3}\+\d{0,2}'?$/.test(d))return{s:"cn",t:d.replace(/'$/,"")+"'"};
  if(/^(İY|IY|DA|HT)$/i.test(d))return{s:"cn",t:"İY"};
  if(/^(MS|Bitti|FT|UZS?|PEN|Pen\.?)/i.test(d))return{s:"bt",t:d.slice(0,4)};
  if(/^(Ert|İpt|Ipt|Yar|Ter)/i.test(d))return{s:"ip",t:d.slice(0,4)};
  return{s:"bs",t:m.saat||"–"};
}
const sk=v=>/^\d+$/.test(String(v??"").trim())?String(v).trim():"";
async function vFik(){
  if(tab!="fik")return;
  $("v").innerHTML=`<div class="dt"><button onclick="fg.setDate(fg.getDate()-1);fF='';vFik()">‹</button><span>${fg.toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"})}</span><button onclick="fg.setDate(fg.getDate()+1);fF='';vFik()">›</button></div>
  <div id="fsg"></div><input id="fq" placeholder="🔍 Takım veya lig ara" value="${e(fQ)}" oninput="fQ=this.value;fCiz()" style="margin:0 0 12px">
  <div id="fl"><div class="skel" style="height:220px;border-radius:22px;background:var(--s1)"></div></div><div class="lg" id="fat" style="text-align:center;margin-top:4px"></div>`;
  await fYukle();
  clearInterval(cdT);
  let tk=0;
  if(key(fg)==key(new Date()))cdT=setInterval(()=>{if(tab!="fik"||document.visibilityState!="visible")return;if(++tk%2)fCiz();else fYukle()},15000);
}
async function fYukle(){
  const d=key(fg);
  const {data,error}=await sb.rpc("fikstur",{d});
  if(tab!="fik"||key(fg)!=d)return;
  fErr=error?"Maçlar yüklenemedi.":(data&&!data.ok?(data.msg||"Maçlar yüklenemedi."):(data&&data.eski?"Veri güncellenemedi, son alınan gösteriliyor.":""));
  FM=(data&&data.m)||[];fAt=data&&data.at;
  if(!fF)fF=FM.some(m=>fDur(m).s=="cn")?"cn":"hep";
  fCiz();
}
function fCiz(){
  if(tab!="fik"||!$("fl"))return;
  const n={cn:0,hep:FM.length,bt:0};FM.forEach(m=>{const s=fDur(m).s;if(s=="cn")n.cn++;if(s=="bt")n.bt++});
  $("fsg").innerHTML=`<div class="sg">${[["cn","🔴 Canlı"],["hep","Tümü"],["bt","Biten"]].map(([k,t])=>`<button class="${fF==k?"on":""}" onclick="fF='${k}';fCiz()">${t} (${n[k]})</button>`).join("")}</div>`;
  const q=fQ.trim().toLocaleLowerCase("tr");
  const L=FM.filter(m=>(fF=="hep"||fDur(m).s==fF)&&(!q||[m.ev,m.dep,m.lig].join(" ").toLocaleLowerCase("tr").includes(q)));
  const G={};L.forEach(m=>{const l=m.lig||"Diğer";(G[l]=G[l]||[]).push(m)});
  const K=Object.keys(G).sort((a,b)=>lPri(a)-lPri(b)||a.localeCompare(b,"tr"));
  $("fl").innerHTML=(fErr?`<div class="c lg" style="text-align:center;color:#FB923C">${e(fErr)}</div>`:"")+(K.map(l=>`<div class="c fk"><div class="fkh">${e(l)}</div>${G[l].map(m=>{
    const D=fDur(m),gs=D.s=='cn'||D.s=='bt',a=gs?sk(m.s1):"",b=gs?sk(m.s2):"",c=D.s=="cn"?"cn":"",w=D.s=="bt"&&a&&b&&a!=b;
    return `<div class="fr"><div class="fm ${c}">${e(D.t)}${m.iy&&gs?`<div style="font-size:10px;color:var(--mut);font-weight:600">İY ${e(m.iy)}</div>`:""}</div><div class="ft"><div class="${w&&+a<+b?"fw":""}">${e(m.ev)}</div><div class="${w&&+b<+a?"fw":""}">${e(m.dep)}</div></div><div class="fs ${c}"><div>${a}</div><div>${b}</div></div></div>`}).join("")}</div>`).join("")
    ||bos(fF=="cn"?"Şu an canlı maç yok.":q?"Aramana uygun maç yok.":"Bu gün için maç bulunamadı."));
  const at=$("fat");if(at)at.textContent=fAt?"Son güncelleme "+new Date(fAt).toLocaleTimeString("tr-TR")+(key(fg)==key(new Date())?" · 30 sn'de bir yenilenir":""):"";
}

const bDots=s=>{const a=(s||[]).slice().reverse();return `<div class="bdots">${a.map(d=>`<i class="${d=="tuttu"?"ok":"no"}"></i>`).join("")}${"<i></i>".repeat(5-a.length)}</div>`};
const bGun=d=>{if(!d)return"–";const g=Math.round((new Date(key(new Date()))-new Date(d))/864e5);return g<=0?"Bugün":g+" gün"};
const bBox=b=>b.strateji=="surpriz"?`<div class="bbx"><b style="color:#EC4899">${b.kazanan}</b><span>Tutan</span></div><div class="bbx"><b>${b.toplam+(b.bekleyen||0)}</b><span>Tahmin</span></div><div class="bbx"><b style="font-size:${b.son_tutan?13:15}px">${bGun(b.son_tutan)}</b><span>Son tutan</span></div>`:`<div class="bbx"><b style="color:${b.toplam?bYc(b.yuzde):"var(--mut)"}">${b.toplam?"%"+b.yuzde:"–"}</b><span>Başarı</span></div><div class="bbx"><b>${b.toplam+(b.bekleyen||0)}</b><span>Tahmin</span></div><div class="bbx"><b style="color:var(--ok)">${b.kazanan}</b><span>Kazanan</span></div>`;
async function vBot(){
  const P=[["bugun","Bugün"],["dun","Dün"],["ay","Bu Ay"],["gecen","Geçen Ay"],["tum","Tümü"]];
  $("v").innerHTML=ktabs()+`<div class="c bhero"><div style="display:flex;gap:12px;align-items:center"><div class="bav" style="--bc:#9B5CFF;width:48px;height:48px;font-size:24px">🤖</div><div><b style="font-size:17px">Goleo AI Botları</b><div class="lg" style="margin:3px 0 0"><span class="bon"></span>Otomatik çalışıyor · 15 dk'da bir tarar</div></div></div>
  <div class="lg" style="margin:10px 0 0">Botlar iddaa oranlarını ve takımların son maç formunu tarar. Her tahminin altında takımların form verisinden hazırlanan bir analiz bulunur. Maç bitince sonuç otomatik işlenir; istatistikler gerçek sonuçlardan hesaplanır, kazanç garantisi vermez.</div></div>
  <div class="sg bper">${P.map(([k,n])=>`<button class="${k==bP?"on":""}" onclick="bP='${k}';vBot()">${n}</button>`).join("")}</div><div id="bl"><div class="c" style="height:240px;opacity:.4"></div></div>`;
  const [{data,error}]=await Promise.all([sb.rpc("bot_istatistik",{per:bP}),bTkGet()]);
  if(tab!="kup"||kT!="bot"||bSel||!$("bl"))return;
  BOTS=data||[];
  $("bl").innerHTML=error?bos("Botlar yüklenemedi."):BOTS.length?`<div class="c" style="padding:6px 14px">${BOTS.map(b=>`<div class="brow" onclick="bSel=${b.id};bg=new Date();vBotD()">${bAv(b)}<div class="bnm"><b>${e(b.ad)} ${bStar(b.id)}</b>${bDots(b.son5)}</div>${bBox(b)}</div>`).join("")}</div>`:bos("Henüz bot yok.");
}
async function vBotD(){
  const id=bSel,d=key(bg);
  let b=BOTS.find(x=>x.id==id);
  if(!BTK.size)await bTkGet();
  if(!b){const {data}=await sb.rpc("bot_istatistik",{per:"tum"});BOTS=data||[];b=BOTS.find(x=>x.id==id);if(!b){bSel=null;return vBot()}}
  $("v").innerHTML=ktabs()+`<button class="g" style="width:auto;padding:9px 14px;margin:0 0 12px" onclick="bSel=null;vBot()">‹ Tüm botlar</button>
  <div class="c"><div style="display:flex;gap:12px;align-items:center">${bAv(b,56)}<div style="flex:1;min-width:0"><b style="font-size:19px">${e(b.ad)}${b.vip?' <span class="bvip">VIP</span>':""} ${bStar(b.id)}</b><div class="lg" style="margin:3px 0 0">${e(b.aciklama||"")}</div>${bDots(b.son5)}</div></div>
  <div class="bstat">${bBox(b)}</div>${b.strateji=="surpriz"&&b.son_tutan_oran?`<div class="pk" style="display:block;text-align:center;margin-top:10px;background:rgba(236,72,153,.14);color:#F9A8D4;border-color:rgba(236,72,153,.35)">💥 Son tutan: ${bGun(b.son_tutan)} önce · oran ${Number(b.son_tutan_oran).toFixed(2)}</div>`:""}<div class="lg" style="text-align:center;margin:8px 0 0">${bP=="tum"?"Tüm zamanlar":"Seçili dönem"}${b.bekleyen?` · ${b.bekleyen} tahmin sonuç bekliyor`:""} · Başarı sonuçlananlardan hesaplanır</div></div>
  <div class="dt"><button onclick="bg.setDate(bg.getDate()-1);vBotD()">‹</button><span>${bg.toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"})}</span><button onclick="bg.setDate(bg.getDate()+1);vBotD()">›</button></div><div id="bt"><div class="c" style="height:120px;opacity:.4"></div></div>`;
  const {data,error}=await sb.rpc("bot_tahminler",{bid:id,d});
  if(tab!="kup"||kT!="bot"||bSel!=id||key(bg)!=d||!$("bt"))return;
  const L=data||[];BSRC=[];
  $("bt").innerHTML=error?bos("Tahminler yüklenemedi."):L.length?L.map(t=>{
    const sk=t.s1!=null&&t.s2!=null?`<span class="pk" style="margin:0 0 0 6px">${t.s1}-${t.s2}</span>`:"";
    const dz=t.durum=="tuttu"?'<span class="pk y">✓ TUTTU</span>':t.durum=="yatti"?'<span class="pk k">✗ YATTI</span>':t.durum=="iptal"?'<span class="pk">ERTELENDİ</span>':'<span class="pk">⏳ BEKLİYOR</span>';
    const fc=f=>f&&f.form?`<span class="fch">${[...f.form].map(c=>`<i class="${c=="G"?"w":c=="M"?"l":"d"}">${c}</i>`).join("")}</span>`:"";
    const fr=t.form&&(t.form.ev&&t.form.ev.form||t.form.dep&&t.form.dep.form)?`<div class="frm"><div><span>${e(t.ev)}</span>${fc(t.form.ev)}</div><div><span>${e(t.dep)}</span>${fc(t.form.dep)}</div></div>`:"";
    const big=Number(t.oran)>=5;
    const an=!t.kilit&&t.analiz?`<details class="ban"><summary>📊 Maç analizi</summary><p>${e(t.analiz)}</p>${(t.kaynaklar||[]).length?`<div class="bsrc">${t.kaynaklar.map(k=>`<a onclick="openL(BSRC[${BSRC.push(String(k.url||""))-1}])">${e(k.baslik||"Kaynak")}</a>`).join("")}</div>`:""}</details>`:"";
    return `<div class="c"><div class="lg">${e(t.lig)} · ${e(t.saat)}</div><div class="tk"><span>${e(t.ev)} – ${e(t.dep)}</span>${t.kilit||big?"":`<span style="color:${gc(t.guven)}">%${t.guven}</span>`}</div>${fr}
    ${t.kilit?`<div class="bl"><div class="bx"><b>MS 1 · Oran 1.45</b><div>Güven %70</div></div><div class="ov"><button onclick="kT='kup';bSel=null;vipGit()">🔒 VIP ile aç</button></div></div>`
    :`<div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:16px">${e(t.tahmin)}</b><span class="pk" style="margin:0;${big?"background:rgba(236,72,153,.16);color:#F9A8D4;border-color:rgba(236,72,153,.4);font-size:14px":""}">Oran ${Number(t.oran).toFixed(2)}</span>${sk}</div>`}<div>${dz}</div>${an}</div>`}).join(""):bos(key(bg)==key(new Date())?"Bu bot bugün henüz tahmin paylaşmadı. Uygun maç bulunca otomatik paylaşır.":"Bu gün için tahmin yok.");
}
</script></body></html>
