<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goleo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;color:#111;font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
header h1{margin:0;font-size:26px;letter-spacing:2px}
.pt{background:#1b4fd8;color:#fff;border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px}
#v{padding:8px 14px}
.c{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.mac{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.lg{font-size:12px;color:#667;margin-bottom:4px}
.tk{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.pk{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;background:#e9edf3;border-radius:8px;padding:4px 8px}
.y{background:#1a8f3c;color:#fff}.k{background:#d33;color:#fff}
h3{margin:14px 4px 8px;font-size:15px;color:#445}
input,select,textarea,button{font:inherit;font-size:16px;padding:10px;border:1px solid #ccd;border-radius:10px;width:100%;margin:4px 0;background:#fff;color:#111}
button{background:#1b4fd8;color:#fff;border:0;font-weight:700}
button.g{background:#667}button.r{background:#d33}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fffe;backdrop-filter:blur(8px);border-top:1px solid #dde;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;font-size:11px;font-weight:700;color:#778;padding:4px 0}
nav a i{display:block;font-style:normal;font-size:20px}
nav a.on{color:#1b4fd8}
.sg{display:flex;gap:6px;margin-bottom:10px}
.sg button{padding:8px 4px;font-size:13px;background:#fff;color:#334}
.sg button.on{background:#1b4fd8;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.lb{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef}
.lb b:first-child{width:28px;color:#778}.lb span{flex:1;font-weight:600}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:99}
.bos{text-align:center;color:#778;padding:24px}
.dt{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;font-weight:600;font-size:14px}
.dt button{width:36px;padding:6px;border-radius:50%}
</style></head><body>
<header><h1>Goleo</h1><span class="pt" id="pt"></span></header>
<div id="v"></div>
<nav id="nav" style="display:none"></nav>
<div id="ts"></div>
<script>
const sb=supabase.createClient("https://iaomtetwapkqaudmdzit.supabase.co","sb_publishable_NA6zmK6sku27Zt7bUqULMA_-Os-ojfo");
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const BOT="goleoaibot"; /* Telegram bot kullanıcı adın (@ olmadan). Boşsa davet linki site adresi olur. */
const $=id=>document.getElementById(id);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const REF=(new URLSearchParams(location.search).get("ref")||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"").toUpperCase();
let me,cur,prof,tab="sp",kayit=false,per="week",kg=new Date(),ts2="chat",SPM={},CP={},RL="";
const key=d=>d.toLocaleDateString("sv-SE");
const fz=d=>new Date(d).toLocaleString("tr-TR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const okUrl=u=>/^https?:\/\//i.test(u);
function toast(t){const x=$("ts");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2500)}
const hata=m=>({"Invalid login credentials":"E-posta veya şifre hatalı","User already registered":"Bu e-posta zaten kayıtlı"}[m]||m);

sb.auth.onAuthStateChange((_,s)=>{const id=s?s.user.id:null;if(id===cur)return;cur=id;me=s?s.user:null;setTimeout(start,0)});

async function start(){
  if(!me){$("nav").style.display="none";$("pt").textContent="";return authV()}
  const {data}=await sb.from("profiles").select("*").eq("id",me.id).single();
  prof=data;$("pt").textContent="⭐ "+prof.points;
  const T=[["sp","🤝","Sponsorlar"],["kup","🎫","Kupon"],["top","💬","Topluluk"],["sir","🏆","Sıralama"],["pro","👤","Profil"]];
  if(prof.is_admin)T.push(["adm","⚙️","Admin"]);
  $("nav").innerHTML=T.map(([k,i,n])=>`<a id="n-${k}" onclick="go('${k}')"><i>${i}</i>${n}</a>`).join("");
  $("nav").style.display="flex";go(tab);
}
function go(t){tab=t;document.querySelectorAll("nav a").forEach(a=>a.className=a.id=="n-"+t?"on":"");({sp:vSp,kup:vKup,top:vTop,sir:vSir,pro:vPro,adm:vAdm})[t]()}

/* GIRIS */
function authV(){
  $("v").innerHTML=`<div class="c"><h3 style="margin-top:0">${kayit?"Kayıt Ol":"Giriş Yap"}</h3>
  <input id="em" type="email" placeholder="E-posta" autocomplete="email">
  <input id="pw" type="password" placeholder="Şifre (en az 6 karakter)">
  ${kayit?`<input id="un" placeholder="Kullanıcı adı"><input id="rf" placeholder="Referans kodu (varsa)" value="${e(REF)}">`:""}
  <button onclick="auth()">${kayit?"Kayıt Ol":"Giriş Yap"}</button>
  <button class="g" onclick="kayit=!kayit;authV()">${kayit?"Hesabım var":"Hesap oluştur"}</button></div>`}
async function auth(){
  const email=$("em").value.trim(),pw=$("pw").value;let r;
  if(kayit){
    const un=$("un").value.trim();
    if(un.length<3)return toast("Kullanıcı adı en az 3 karakter");
    r=await sb.auth.signUp({email,password:pw,options:{data:{username:un,ref:$("rf").value.trim()}}});
  }else r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return toast(hata(r.error.message));
  if(kayit&&!r.data.session)toast("Kayıt alındı. E-postanı onaylayıp giriş yap.");
}

/* SPONSORLAR */
async function vSp(){
  const {data}=await sb.from("sponsors").select("*").eq("active",true).order("sort").order("id");
  SPM=Object.fromEntries((data||[]).map(x=>[x.id,x]));
  const l=(data||[]).map(x=>`<div class="c"><div style="display:flex;gap:10px;align-items:center"><div style="font-size:28px">${x.kind=="kanal"?"📢":"🌐"}</div><div style="flex:1;min-width:0"><b>${e(x.title)}</b>${x.descr?`<div class="lg" style="margin:2px 0 0">${e(x.descr)}</div>`:""}</div></div>
  <button style="margin-top:10px" onclick="spGit(${x.id})">${x.kind=="kanal"?"Kanala katıl":"Siteye git"}</button></div>`).join("");
  if(tab=="sp")$("v").innerHTML=l||'<div class="bos">Şu an sponsor yok.</div>'}
function spGit(id){
  const u=SPM[id]&&SPM[id].url;if(!u||!okUrl(u))return;
  if(tg&&/^https:\/\/t\.me\//i.test(u))tg.openTelegramLink(u);else if(tg)tg.openLink(u);else window.open(u,"_blank")}

/* KUPON */
const TUR=[["tekli","TEKLİ KUPON"],["ikili","2'Lİ KUPON"],["uclu","3'LÜ KUPON"]];
const rz=d=>d=="tuttu"?'<span class="pk y">✓ TUTTU</span>':d=="yatti"?'<span class="pk k">✗ YATTI</span>':"";
async function vKup(){
  const {data}=await sb.from("coupons").select("*").eq("gun",key(kg)).order("id");
  const l=data||[];
  const h=TUR.map(([k,ad])=>l.filter(c=>c.tur==k).map(c=>`<div class="c"><b>${ad}</b>`+(c.items||[]).map(m=>`<div class="mac" style="background:#f1f4fa;margin:8px 0 0"><div class="lg">${e(m.lig)} · ${e(m.saat)}</div><div class="tk"><span>${e(m.ev)} – ${e(m.dep)}</span><span style="color:${m.guven>=60?"#1a8f3c":"#d9531e"}">%${e(m.guven)}</span></div><div style="margin-top:6px;font-weight:700">${e(m.tahmin)} ${rz(m.durum)}</div></div>`).join("")+"</div>").join("")).join("");
  if(tab=="kup")$("v").innerHTML=`<div class="dt"><button onclick="kg.setDate(kg.getDate()-1);vKup()">‹</button><span>${kg.toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"})}</span><button onclick="kg.setDate(kg.getDate()+1);vKup()">›</button></div>`+(h||'<div class="bos">Bu gün için kupon yok.</div>')}

/* TOPLULUK */
async function vTop(){
  const seg=`<div class="sg"><button class="${ts2=="chat"?"on":""}" onclick="ts2='chat';vTop()">💬 Sohbet</button><button class="${ts2=="tips"?"on":""}" onclick="ts2='tips';vTop()">📋 Paylaşımlar</button></div>`;
  if(ts2=="chat"){
    const {data}=await sb.from("messages").select("*,profiles(username)").order("created_at",{ascending:false}).limit(50);
    if(tab!="top"||ts2!="chat")return;
    $("v").innerHTML=seg+`<div class="c" style="padding:10px"><div id="cb" style="height:calc(100dvh - 330px);min-height:240px;overflow-y:auto">${(data||[]).reverse().map(cm).join("")||'<div class="bos" id="ce">Henüz mesaj yok. İlk mesajı sen yaz!</div>'}</div>
    <div class="row" style="margin-top:8px"><input id="ci" placeholder="Mesaj yaz..." maxlength="300" style="flex:4" onkeydown="if(event.key=='Enter')cSend()"><button style="flex:1" onclick="cSend()">➤</button></div></div>`;
    const b=$("cb");b.scrollTop=b.scrollHeight;return}
  const {data}=await sb.from("tips").select("*,profiles(username)").order("created_at",{ascending:false}).limit(40);
  const row='<div class="row pr"><input placeholder="Maç (A - B)"><input placeholder="Tahmin"></div>';
  const f=`<div class="c"><b>Tahminini paylaş</b>${row+row+row}<textarea id="nt" rows="2" placeholder="Not (isteğe bağlı)"></textarea><button onclick="paylas()">Paylaş</button></div>`;
  const l=(data||[]).map(t=>`<div class="c"><div class="lg">@${e(t.profiles&&t.profiles.username)} · ${fz(t.created_at)} ${rz(t.status=="won"?"tuttu":t.status=="lost"?"yatti":"")}</div>`+(t.items||[]).map(i=>`<div style="font-weight:700;margin-top:4px">${e(i.mac)} → ${e(i.tahmin)}</div>`).join("")+(t.note?`<div style="margin-top:6px;color:#556">${e(t.note)}</div>`:"")+"</div>").join("");
  if(tab=="top"&&ts2=="tips")$("v").innerHTML=seg+f+(l||'<div class="bos">Henüz paylaşım yok.</div>')}
async function paylas(){
  const items=[...document.querySelectorAll(".pr")].map(r=>({mac:r.children[0].value.trim(),tahmin:r.children[1].value.trim()})).filter(x=>x.mac&&x.tahmin);
  if(!items.length)return toast("En az bir maç ve tahmin yaz");
  const {error}=await sb.from("tips").insert({user_id:me.id,note:$("nt").value.trim(),items});
  toast(error?"Paylaşılamadı":"Paylaşıldı ✓");vTop()}
function cm(m){
  const mine=m.user_id==me.id;
  return `<div id="m${m.id}" style="display:flex;justify-content:${mine?"flex-end":"flex-start"};margin:6px 0"><div style="max-width:80%;background:${mine?"#1b4fd8":"#f1f4fa"};color:${mine?"#fff":"#111"};border-radius:14px;padding:8px 12px">
  <div style="font-size:11px;opacity:.7;font-weight:700">${mine?"Sen":"@"+e(m.profiles&&m.profiles.username)} · ${new Date(m.created_at).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}${(prof.is_admin||mine)?` <a onclick="cDel(${m.id})" style="cursor:pointer"> ✕</a>`:""}</div>
  <div style="word-break:break-word">${e(m.body)}</div></div></div>`}
function cAdd(m){
  const b=$("cb");if(!b||$("m"+m.id))return;
  const x=$("ce");if(x)x.remove();
  b.insertAdjacentHTML("beforeend",cm(m));b.scrollTop=b.scrollHeight}
async function cSend(){
  const t=$("ci").value.trim();if(!t)return;
  $("ci").value="";
  const {data,error}=await sb.from("messages").insert({user_id:me.id,body:t}).select("*,profiles(username)").single();
  if(error){$("ci").value=t;return toast("Gönderilemedi, biraz yavaş yaz")}
  cAdd(data)}
async function cDel(id){await sb.from("messages").delete().eq("id",id)}
sb.channel("chat")
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async p=>{
   if(!me||tab!="top"||ts2!="chat"||!$("cb")||$("m"+p.new.id))return;
   const {data}=await sb.from("messages").select("*,profiles(username)").eq("id",p.new.id).single();
   if(data)cAdd(data)})
 .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},p=>{const x=$("m"+p.old.id);if(x)x.remove()})
 .subscribe();

/* SIRALAMA */
async function vSir(){
  const {data}=await sb.rpc("leaderboard",{period:per});
  const P=[["week","Haftalık"],["month","Aylık"],["year","Yıllık"],["all","Tüm Zaman"]];
  if(tab=="sir")$("v").innerHTML=`<div class="sg">${P.map(([k,n])=>`<button class="${k==per?"on":""}" onclick="per='${k}';vSir()">${n}</button>`).join("")}</div><div class="c">`+((data||[]).map((r,i)=>`<div class="lb"><b>${i+1}</b><span>${i<3?["🥇","🥈","🥉"][i]+" ":""}${e(r.username)}${r.user_id==me.id?" (sen)":""}</span><b>${r.total}</b></div>`).join("")||'<div class="bos">Henüz puan yok.</div>')+"</div>"}

/* PROFIL */
async function vPro(){
  const [r,l,pf]=await Promise.all([
    sb.from("profiles").select("id",{count:"exact",head:true}).eq("referred_by",me.id),
    sb.from("points_log").select("*").order("created_at",{ascending:false}).limit(10),
    sb.from("profiles").select("points").eq("id",me.id).single()]);
  if(pf.data){prof.points=pf.data.points;$("pt").textContent="⭐ "+prof.points}
  RL=BOT?"https://t.me/"+BOT+"?startapp="+prof.ref_code:location.origin+location.pathname+"?ref="+prof.ref_code;
  const lg=(l.data||[]).map(x=>`<div class="lb"><span>${e(x.reason)}</span><b>${x.points>0?"+":""}${x.points}</b></div>`).join("")||'<div class="bos">Henüz puan yok.</div>';
  if(tab=="pro")$("v").innerHTML=`<div class="c"><h2 style="margin:0">@${e(prof.username)}</h2><div class="lg">${e(me.email)}</div>
  <div class="row" style="margin-top:12px;text-align:center"><div><b style="font-size:24px">${prof.points}</b><div class="lg">Puan</div></div><div><b style="font-size:24px">${r.count||0}</b><div class="lg">Davet</div></div></div></div>
  <div class="c"><b>Davet et, kişi başı puan kazan</b><div class="lg" style="margin-top:6px">Kodun: <b>${e(prof.ref_code)}</b></div><input readonly value="${e(RL)}">
  <button onclick="kopyala()">Linki kopyala</button>${BOT?'<button class="g" onclick="tgPaylas()">Telegram\'da paylaş</button>':""}</div>
  <div class="c"><b>Son puanlar</b>${lg}</div><button class="g" onclick="sb.auth.signOut()">Çıkış yap</button>`}
function kopyala(){navigator.clipboard&&navigator.clipboard.writeText(RL);toast("Link kopyalandı")}
function tgPaylas(){const u="https://t.me/share/url?url="+encodeURIComponent(RL)+"&text="+encodeURIComponent("Goleo'da puan topla! 🏆");tg?tg.openTelegramLink(u):window.open(u)}

/* ADMIN */
async function vAdm(){
  const [s,st,c,t,sp]=await Promise.all([
    sb.rpc("admin_stats"),
    sb.from("settings").select("*"),
    sb.from("coupons").select("*").order("gun",{ascending:false}).order("id",{ascending:false}).limit(12),
    sb.from("tips").select("*,profiles(username)").eq("status","pending").order("created_at").limit(30),
    sb.from("sponsors").select("*").order("sort").order("id")]);
  const S=s.data||{},ST=Object.fromEntries((st.data||[]).map(x=>[x.key,x.value]));
  CP=Object.fromEntries((c.data||[]).map(x=>[x.id,x]));
  const k=(n,l)=>`<div class="c" style="margin:0;text-align:center"><b style="font-size:24px">${n??0}</b><div class="lg">${l}</div></div>`;
  const sph=(sp.data||[]).map(x=>`<div class="c" style="background:#f1f4fa;margin:8px 0"><b>${x.kind=="kanal"?"📢":"🌐"} ${e(x.title)}</b>${x.active?"":" (kapalı)"}<div class="lg">${e(x.url)}</div>
  <div class="row"><button class="g" onclick="spTog(${x.id},${!x.active})">${x.active?"Kapat":"Aç"}</button><button class="r" onclick="spSil(${x.id})">Sil</button></div></div>`).join("");
  const ch=(c.data||[]).map(x=>`<div class="c"><b>${x.gun} · ${x.tur}</b>`+(x.items||[]).map((i,n)=>`<div style="margin-top:8px">${e(i.ev)} – ${e(i.dep)}: ${e(i.tahmin)}<select onchange="setD(${x.id},${n},this.value)"><option value="">⏳ Bekliyor</option><option value="tuttu" ${i.durum=="tuttu"?"selected":""}>✅ Tuttu</option><option value="yatti" ${i.durum=="yatti"?"selected":""}>❌ Yattı</option></select></div>`).join("")+`<button class="r" onclick="ksil(${x.id})">Kuponu sil</button></div>`).join("");
  const th=(t.data||[]).map(x=>`<div class="c"><div class="lg">@${e(x.profiles&&x.profiles.username)}</div>`+(x.items||[]).map(i=>`<div style="font-weight:700">${e(i.mac)} → ${e(i.tahmin)}</div>`).join("")+`<div class="row"><button onclick="tdur(${x.id},'won')">✅ Tuttu</button><button class="r" onclick="tdur(${x.id},'lost')">❌ Yattı</button></div></div>`).join("");
  if(tab!="adm")return;
  $("v").innerHTML=`<h3>📊 İstatistik</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${k(S.toplam,"Toplam üye")}${k(S.bugun,"Bugün katılan")}${k(S.aktif1,"Aktif (24 saat)")}${k(S.aktif7,"Aktif (7 gün)")}${k(S.mesaj,"Toplam mesaj")}${k(S.paylasim,"Toplam paylaşım")}</div>
  <div class="lg" style="margin:6px 4px">Aktif: o sürede mesaj yazan ya da paylaşım ekleyen üye.</div>
  <h3>⚙️ Puan ayarları</h3><div class="c">
  <div class="lg">Davet başına referans puanı</div><input id="sr" type="number" value="${ST.ref_points??50}">
  <div class="lg">Tutan paylaşım puanı</div><input id="st" type="number" value="${ST.tip_points??20}">
  <button onclick="sKaydet()">Ayarları kaydet</button></div>
  <h3>👥 Üye yönetimi</h3><div class="c"><input id="uq" placeholder="Kullanıcı adı veya e-posta ara"><button onclick="uAra()">Ara / Son üyeleri göster</button><div id="au"></div></div>
  <h3>🤝 Sponsorlar</h3><div class="c"><select id="sk1"><option value="kanal">📢 Telegram kanalı</option><option value="site">🌐 Web sitesi</option></select>
  <input id="sn1" placeholder="Ad"><input id="sl1" placeholder="Link (https://t.me/... ya da https://...)"><input id="sd1" placeholder="Kısa açıklama (isteğe bağlı)"><input id="so1" type="number" placeholder="Sıra (küçük olan önce)">
  <button onclick="spEkle()">Sponsor ekle</button>${sph}</div>
  <h3>🎫 Kupon ekle</h3><div class="c"><input id="kd" type="date" value="${key(new Date())}"><select id="ku"><option value="tekli">Tekli</option><option value="ikili">2'li</option><option value="uclu">3'lü</option></select>
  <textarea id="kt" rows="4" placeholder="Her satıra bir maç:&#10;Lig | Ev | Dep | Saat | Tahmin | Güven"></textarea><button onclick="kekle()">Kuponu ekle</button></div>
  <h3>Kuponlar</h3>${ch||'<div class="bos">Kupon yok.</div>'}
  <h3>Bekleyen paylaşımlar</h3>${th||'<div class="bos">Bekleyen yok.</div>'}`}
async function sKaydet(){
  const {error}=await sb.from("settings").upsert([{key:"ref_points",value:+$("sr").value},{key:"tip_points",value:+$("st").value}]);
  toast(error?error.message:"Ayarlar kaydedildi")}
async function uAra(){
  const {data}=await sb.rpc("admin_users",{q:$("uq").value.trim()});
  $("au").innerHTML=(data||[]).map(u=>`<div class="c" style="margin:8px 0;background:#f1f4fa"><b>@${e(u.username)}</b> · ⭐ ${u.points}<div class="lg">${e(u.email)}</div>
  <div class="row"><input id="p${u.id}" type="number" placeholder="+50 ya da -20"><input id="r${u.id}" placeholder="Neden"></div>
  <button onclick="pEkle('${u.id}')">Puanı uygula</button></div>`).join("")||'<div class="bos">Üye bulunamadı.</div>'}
async function pEkle(id){
  const v=parseInt($("p"+id).value);if(!v)return toast("Puan gir");
  const {error}=await sb.rpc("admin_add_points",{uid:id,pts:v,why:$("r"+id).value.trim()||"admin düzeltme"});
  toast(error?error.message:"Puan uygulandı");uAra()}
async function spEkle(){
  const row={kind:$("sk1").value,title:$("sn1").value.trim(),url:$("sl1").value.trim(),descr:$("sd1").value.trim()||null,sort:+$("so1").value||0};
  if(!row.title||!okUrl(row.url))return toast("Ad ve https:// ile başlayan link gerekli");
  const {error}=await sb.from("sponsors").insert(row);
  toast(error?error.message:"Sponsor eklendi");vAdm()}
async function spTog(id,a){await sb.from("sponsors").update({active:a}).eq("id",id);vAdm()}

/* CEKILIS */
let cdT;
const _go=go;
go=function(t){clearInterval(cdT);_go(t)};

function cdTick(end){
  const el=$("cd");if(!el){clearInterval(cdT);return}
  const s=Math.floor((new Date(end)-Date.now())/1000);
  if(s<=0){el.textContent="Süre doldu";return}
  const g=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  el.textContent=(g?g+"g ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

const _vPro=vPro;
vPro=async function(){
  await _vPro();

  let h="";
  if(R.status=="open"){
    const [pf,mine,stt]=await Promise.all([
      sb.from("profiles").select("tg_username,points").eq("id",me.id).single(),
      sb.from("raffle_entries").select("id",{count:"exact",head:true}).eq("raffle_id",R.id).eq("user_id",me.id),
      sb.rpc("raffle_stats",{rid:R.id})]);
    const pts=pf.data.points,have=mine.count||0,S=stt.data||{};
    const bitti=new Date(R.ends_at)<=new Date();
    const allowed=R.spend?Math.floor(pts/R.cost):Math.floor(pts/R.cost)-have;
    const kapali=bitti||allowed<1;
    h=`<div class="c" style="border:2px solid #1b4fd8"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>🎁 ${e(R.title)}</b><span class="pk">${R.winners} kazanan${R.backups?" + "+R.backups+" yedek":""}</span></div>
    <div style="font-size:13px;color:#556;margin:6px 0;white-space:pre-line">${e(R.descr||"")}</div>
    <div id="cd" style="text-align:center;font-size:26px;font-weight:800"></div><div class="lg" style="text-align:center">Bitmesine kalan süre</div>
    <div class="lg" style="margin-top:8px">Her katılım için ${R.cost} puan ${R.spend?"harcanır":"gerekir (puanın düşmez)"} · Toplam ${S.entries||0} katılım</div>
    <div class="lg">Puanın: ⭐ ${pts} · Katılımların: ${have}</div>
    <div class="lg">Telegram kullanıcı adın</div>
    <div class="row"><input id="tgu" placeholder="@kullaniciadi" value="${pf.data.tg_username?"@"+e(pf.data.tg_username):""}"><button class="g" style="flex:none;width:auto" onclick="tgKaydet()">Kaydet</button></div>
    <div class="row"><input id="cn" type="number" min="1" value="1" ${kapali?"disabled":""}><button onclick="cKatil(${R.id})" ${kapali?"disabled":""}>Katıl</button></div>
    <div class="lg" style="${kapali?"color:#d33":""}">${bitti?"Süre doldu, sonuç bekleniyor.":allowed<1?(pts<R.cost?"Puanın yetmiyor.":"Daha fazla katılamazsın."):"En fazla "+allowed+" kez katılabilirsin."}</div></div>`;
  }else{
    const {data:w}=await sb.rpc("get_raffle_winners",{rid:R.id});
    const ben=(w||[]).find(x=>x.username==prof.username);
    h=`<div class="c" style="border:2px solid #1a8f3c"><b>🎉 ${e(R.title)} sonuçları</b>
    ${ben?`<div class="pk y" style="display:block;margin:8px 0;text-align:center">Tebrikler, ${ben.kind=="asil"?"kazandın":"yedek listesindesin"}! Seninle Telegram'dan iletişime geçilecek.</div>`:""}
    ${(w||[]).map(x=>`<div class="lb"><span>${x.kind=="asil"?"🏆":"🔁"} ${x.sira}. @${e(x.username)}</span><b>${x.kind=="asil"?"Asıl":"Yedek"}</b></div>`).join("")||'<div class="bos">Katılım olmadı.</div>'}</div>`;
  }
  $("v").insertAdjacentHTML("afterbegin",h);
  if(R.status=="open"){clearInterval(cdT);cdTick(R.ends_at);cdT=setInterval(()=>cdTick(R.ends_at),1000)}
};
async function tgKaydet(){
  const v=$("tgu").value.trim().replace(/^@/,"");
  if(!/^[A-Za-z0-9_]{5,32}$/.test(v))return toast("Geçerli bir Telegram kullanıcı adı yaz");
  const {error}=await sb.from("profiles").update({tg_username:v}).eq("id",me.id);
  toast(error?"Kaydedilemedi":"Kaydedildi ✓")}
async function cKatil(id){
  const n=parseInt($("cn").value)||1;
  const {data,error}=await sb.rpc("raffle_join",{rid:id,n});
  if(error||!data)return toast("Katılınamadı, tekrar dene");
  toast(data.msg);if(data.ok)vPro()}

/* CEKILIS ADMIN */
const _vAdm=vAdm;
vAdm=async function(){
  await _vAdm();
  if(tab!="adm")return;
  const {data:rs}=await sb.from("raffles").select("*").order("id",{ascending:false}).limit(1);
  const R=rs&&rs[0],open=R&&R.status=="open";
  const dl=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
  const f=open?R:{title:"",descr:"",ends_at:Date.now()+864e5,winners:1,backups:0,cost:100};
  let S={};if(open){const s=await sb.rpc("raffle_stats",{rid:R.id});S=s.data||{}}
  let h=`<h3>🎁 Çekiliş</h3><div class="c"><input id="rt" placeholder="Başlık" value="${e(f.title)}">
  <textarea id="rd" rows="2" placeholder="Açıklama (ödül, kurallar)">${e(f.descr||"")}</textarea>
  <div class="lg">Bitiş zamanı</div><input id="re" type="datetime-local" value="${dl(f.ends_at)}">
  <div class="row"><div><div class="lg">Kazanan sayısı</div><input id="rw" type="number" value="${f.winners}"></div><div><div class="lg">Yedek sayısı</div><input id="rb" type="number" value="${f.backups}"></div></div>
  <div class="lg">Katılım için gereken puan</div><input id="rc" type="number" value="${f.cost}">
  ${open?`<div class="lg">Puan ${R.spend?"harcanıyor":"harcanmıyor"} · ${S.users||0} kişi, ${S.entries||0} katılım</div>
  <button onclick="cGuncelle(${R.id})">Güncelle</button><button class="r" onclick="cCek(${R.id})">🎲 Bitir ve rastgele çek</button><button class="g" onclick="cIptal(${R.id})">İptal et</button>`
  :`<select id="rs1"><option value="0">Katılınca puan düşmesin (sadece şart)</option><option value="1">Katılınca puan düşsün (bilet gibi)</option></select><button onclick="cBaslat()">Çekilişi başlat</button>`}</div>`;
  if(R&&R.status=="drawn"){
    const {data:w}=await sb.from("raffle_winners").select("*,profiles(username)").eq("raffle_id",R.id).order("kind").order("sira");
    h+=`<div class="c"><b>Son çekiliş: ${e(R.title)}</b>`+(w||[]).map(x=>`<div class="lb"><span>${x.kind=="asil"?"🏆":"🔁"} ${x.sira}. @${e(x.profiles&&x.profiles.username)}</span><b>@${e(x.tg_username)}</b></div>`).join("")+"</div>";
  }
  if(tab=="adm")$("v").insertAdjacentHTML("afterbegin",h);
};
function cForm(){
  const t=$("rt").value.trim(),en=$("re").value,cost=+$("rc").value;
  if(!t||!en){toast("Başlık ve bitiş zamanı gerekli");return null}
  if(!(cost>0)){toast("Puan 0'dan büyük olmalı");return null}
  return {title:t,descr:$("rd").value.trim()||null,ends_at:new Date(en).toISOString(),winners:Math.max(1,+$("rw").value||1),backups:Math.max(0,+$("rb").value||0),cost};
}
async function cBaslat(){
  const row=cForm();if(!row)return;
  const {error}=await sb.from("raffles").insert({...row,spend:$("rs1").value=="1"});
  toast(error?(error.message.includes("duplicate")?"Zaten açık bir çekiliş var":error.message):"Çekiliş başlatıldı");vAdm()}
async function cGuncelle(id){
  const row=cForm();if(!row)return;
  const {error}=await sb.from("raffles").update(row).eq("id",id);
  toast(error?error.message:"Güncellendi");vAdm()}
async function cCek(id){
  if(!confirm("Çekiliş sonlandırılsın ve kazananlar rastgele seçilsin mi? Geri alınamaz."))return;
  const {data,error}=await sb.rpc("raffle_draw",{rid:id});
  toast(error?error.message:"Çekiliş yapıldı: "+data.secilen+" kişi seçildi");vAdm()}
async function cIptal(id){
  if(!confirm("Çekiliş iptal edilsin mi?"))return;
  const {error}=await sb.rpc("raffle_cancel",{rid:id});
  toast(error?error.message:"İptal edildi");vAdm()}

function krCiz(){
  const n={tekli:1,ikili:2,uclu:3}[$("ku").value]||1;
  const old=[...document.querySelectorAll(".kr")].map(r=>[...r.querySelectorAll("input")].map(i=>i.value));
  $("krw").innerHTML=Array.from({length:n},(_,i)=>`<div class="kr c" style="background:#f1f4fa;margin:8px 0"><b>${i+1}. Maç</b>
  <input class="k-lig" placeholder="Lig (örn. Süper Lig)">
  <div class="row"><input class="k-ev" placeholder="Ev sahibi"><input class="k-dep" placeholder="Deplasman"></div>
  <div class="row"><input class="k-saat" type="time"><input class="k-guven" type="number" min="1" max="100" placeholder="Güven %"></div>
  <input class="k-tahmin" placeholder="Tahmin (örn. MS 1, 2.5 Üst)"></div>`).join("");
  document.querySelectorAll(".kr").forEach((r,i)=>{(old[i]||[]).forEach((v,j)=>{r.querySelectorAll("input")[j].value=v})});
}
async function kekle(){
  const items=[...document.querySelectorAll(".kr")].map(r=>{
    const g=c=>r.querySelector(".k-"+c).value.trim();
    return {lig:g("lig"),ev:g("ev"),dep:g("dep"),saat:g("saat"),tahmin:g("tahmin"),guven:+g("guven")||70,durum:""}});
  if(items.some(m=>!m.ev||!m.dep||!m.tahmin))return toast("Her maç için ev sahibi, deplasman ve tahmin gerekli");
  if(!$("kd").value)return toast("Tarih seç");
  const {error}=await sb.from("coupons").insert({gun:$("kd").value,tur:$("ku").value,items});
  toast(error?error.message:"Kupon eklendi");vAdm()}
